<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fuel Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f0f4fa;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .dashboard {
            max-width: 1600px;
            width: 100%;
        }
        .header {
            background: white;
            border-radius: 20px;
            padding: 20px 28px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .header h1 {
            font-weight: 600;
            font-size: 1.7rem;
            color: #0b2b4a;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 i {
            color: #2a7de1;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .header .badge {
            background: #e9eff8;
            padding: 6px 18px;
            border-radius: 40px;
            color: #1e4b7a;
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .badge .cache-badge {
            font-size: 0.7rem;
            background: #d4e2f5;
            padding: 2px 12px;
            border-radius: 30px;
            color: #1a4b7a;
        }
        .year-selector {
            padding: 6px 16px 6px 14px;
            border-radius: 40px;
            border: 1.5px solid #dce3ec;
            background: white;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1e3a5f;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
            appearance: auto;
        }
        .year-selector:hover {
            border-color: #2a7de1;
        }
        .year-selector:focus {
            border-color: #2a7de1;
            box-shadow: 0 0 0 3px rgba(42, 125, 225, 0.15);
        }
        .btn-refresh {
            background: #2a7de1;
            color: white;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .btn-refresh:hover {
            background: #1a5fb0;
        }
        .btn-refresh:active {
            transform: scale(0.96);
        }
        .btn-refresh:disabled {
            background: #a0b8d0;
            cursor: not-allowed;
            transform: none;
        }
        .btn-export {
            background: #217346;
            color: white;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .btn-export:hover {
            background: #185a32;
        }
        .btn-export:active {
            transform: scale(0.96);
        }
        .btn-export:disabled {
            background: #a0b8a8;
            cursor: not-allowed;
            transform: none;
        }
        .toggle-group {
            display: flex;
            gap: 6px;
            align-items: center;
            background: #f0f4fa;
            padding: 4px;
            border-radius: 40px;
        }
        .toggle-btn {
            border: none;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            background: #dce3ec;
            color: #4a5a6e;
            opacity: 0.6;
        }
        .toggle-btn.active-rm {
            background: #1f5f9e;
            color: white;
            opacity: 1;
            box-shadow: 0 2px 6px rgba(31, 95, 158, 0.3);
        }
        .toggle-btn.active-liter {
            background: #1f8b6b;
            color: white;
            opacity: 1;
            box-shadow: 0 2px 6px rgba(31, 139, 107, 0.3);
        }
        .toggle-btn:active {
            transform: scale(0.94);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: white;
            border-radius: 18px;
            padding: 16px 18px;
            border: 1px solid #eef2f8;
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .stat-card.clickable {
            cursor: pointer;
            user-select: none;
            position: relative;
        }
        .stat-card.clickable:hover {
            border-color: #2a7de1;
            box-shadow: 0 4px 16px rgba(42, 125, 225, 0.12);
        }
        .stat-card.clickable::after {
            content: "\f0d7";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: 10px;
            right: 14px;
            font-size: 0.7rem;
            color: #8a9bb5;
            opacity: 0.5;
        }
        .stat-card .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #6f7e94;
            font-weight: 600;
        }
        .stat-card .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0b2b4a;
            margin-top: 4px;
        }
        .stat-card .sub {
            font-size: 0.72rem;
            color: #3f5a78;
            margin-top: 2px;
        }
        .charts-row {
            display: flex;
            gap: 20px;
            margin-bottom: 28px;
        }
        .chart-panel {
            background: white;
            border-radius: 18px;
            padding: 20px;
            border: 1px solid #eef2f8;
            flex: 1;
            min-width: 0;
        }
        .chart-panel .panel-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #1e3a5f;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-panel .panel-title i {
            color: #2a7de1;
        }
        .chart-canvas-wrap {
            position: relative;
            width: 100%;
            height: 300px;
        }
        .chart-canvas-wrap canvas {
            width: 100% !important;
            height: 100% !important;
        }
        .rank-toggle-group {
            display: flex;
            gap: 4px;
            background: #f0f4fa;
            padding: 3px;
            border-radius: 30px;
            margin-left: auto;
        }
        .rank-toggle-btn {
            border: none;
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.2s;
            background: #dce3ec;
            color: #4a5a6e;
        }
        .rank-toggle-btn.active-rm {
            background: #1f5f9e;
            color: white;
        }
        .rank-toggle-btn.active-liter {
            background: #1f8b6b;
            color: white;
        }
        .rank-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .rank-list::-webkit-scrollbar {
            width: 6px;
        }
        .rank-list::-webkit-scrollbar-track {
            background: #eef2f8;
            border-radius: 3px;
        }
        .rank-list::-webkit-scrollbar-thumb {
            background: #c0d0e0;
            border-radius: 3px;
        }
        .rank-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 10px;
            margin-bottom: 4px;
            transition: background 0.15s;
        }
        .rank-item:hover {
            background: #f5f8fc;
        }
        .rank-num {
            font-weight: 700;
            font-size: 0.85rem;
            color: #8a9bb5;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }
        .rank-item:nth-child(1) .rank-num {
            color: #e6a817;
            font-size: 1rem;
        }
        .rank-item:nth-child(2) .rank-num {
            color: #8a9bb5;
            font-size: 0.95rem;
        }
        .rank-item:nth-child(3) .rank-num {
            color: #b08a5c;
            font-size: 0.9rem;
        }
        .rank-info {
            flex: 1;
            min-width: 0;
        }
        .rank-name {
            font-weight: 600;
            font-size: 0.82rem;
            color: #1e3a5f;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rank-detail {
            font-size: 0.7rem;
            color: #6f7e94;
        }
        .rank-value {
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .rank-value.rm-color {
            color: #1f5f9e;
        }
        .rank-value.liter-color {
            color: #1f8b6b;
        }
        .rank-empty {
            text-align: center;
            padding: 40px 16px;
            color: #9aafc8;
            font-size: 0.85rem;
        }
        .table-container {
            background: white;
            border-radius: 20px;
            border: 1px solid #eef2f8;
            overflow: hidden;
            position: relative;
        }
        .table-scroll-wrapper {
            overflow: auto;
            max-height: 70vh;
            position: relative;
        }
        .table-scroll-wrapper::-webkit-scrollbar {
            width: 14px;
            height: 14px;
        }
        .table-scroll-wrapper::-webkit-scrollbar-track {
            background: #eef2f8;
        }
        .table-scroll-wrapper::-webkit-scrollbar-thumb {
            background: #c0d0e0;
            border-radius: 7px;
        }
        .table-scroll-wrapper::-webkit-scrollbar-thumb:hover {
            background: #a0b8d0;
        }
        .sticky-table {
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.82rem;
            width: 100%;
            min-width: max-content;
            table-layout: auto;
        }
        .sticky-table .col-fixed {
            position: sticky;
            left: 0;
            z-index: 1;
            background: white;
            min-width: 110px;
            width: 110px;
            box-shadow: 2px 0 0 0 #dce3ec;
        }
        .sticky-table .col-fixed:nth-child(1) {
            left: 0;
        }
        .sticky-table .col-fixed:nth-child(2) {
            left: 110px;
        }
        .sticky-table thead .col-fixed {
            z-index: 3;
            background: #f8faff;
        }
        .sticky-table .filter-row .col-fixed {
            z-index: 5;
            background: #f8faff;
        }
        .sticky-table thead tr:not(.filter-row) .col-fixed {
            z-index: 4;
        }
        .sticky-table thead th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #f8faff;
            border-bottom: 2px solid #e2e9f2;
        }
        .sticky-table .filter-row td {
            position: sticky;
            top: 0;
            z-index: 2;
            padding: 8px 12px;
            background: #f8faff;
            border-bottom: 1px solid #eef2f8;
        }
        .sticky-table thead tr:not(.filter-row) th {
            top: 48px;
        }
        .sticky-table th,
        .sticky-table td {
            padding: 10px 12px;
            text-align: left;
            vertical-align: top;
            border-bottom: 1px solid #eef3f9;
            min-width: 110px;
        }
        .sticky-table .col-month {
            min-width: 180px;
            width: 180px;
        }
        .vehicle-cell {
            font-weight: 600;
            color: #0b2b4a;
        }
        .category-item {
            padding: 4px 8px;
            margin: 2px 0;
            background: #f8faff;
            border-radius: 8px;
            border: 1px solid #eef2f8;
            font-size: 0.78rem;
            line-height: 1.5;
        }
        .cat-name {
            font-weight: 600;
            color: #2c4b70;
            display: block;
            margin-bottom: 2px;
        }
        .val-row {
            display: flex;
            gap: 12px;
            font-size: 0.75rem;
        }
        .rm-value {
            color: #1f5f9e;
            font-weight: 600;
        }
        .liter-value {
            color: #1f8b6b;
            font-weight: 600;
        }
        .rm-value::before {
            content: "RM ";
            font-weight: 400;
            color: #5f7c9e;
        }
        .liter-value::after {
            content: " L";
            font-weight: 400;
            color: #5f7c9e;
        }
        .month-selector {
            padding: 4px 12px;
            border-radius: 30px;
            border: 1.5px solid #dce3ec;
            background: white;
            font-weight: 500;
            font-size: 0.78rem;
            color: #1e3a5f;
            cursor: pointer;
            outline: none;
            width: 130px;
        }
        .month-selector:hover {
            border-color: #2a7de1;
        }
        .month-selector:focus {
            border-color: #2a7de1;
            box-shadow: 0 0 0 3px rgba(42, 125, 225, 0.15);
        }
        .filter-label {
            font-weight: 600;
            font-size: 0.78rem;
            color: #1f3a5e;
            margin-right: 8px;
        }
        .category-filter-wrap {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: 12px;
            flex-wrap: wrap;
        }
        .category-filter-wrap .filter-label {
            margin-right: 0;
        }
        .category-chips {
            display: inline-flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .category-chip {
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            border: 1.5px solid #dce3ec;
            background: white;
            color: #4a5a6e;
            transition: all 0.2s;
            white-space: nowrap;
            user-select: none;
        }
        .category-chip:hover {
            border-color: #2a7de1;
        }
        .category-chip.active {
            background: #2a7de1;
            color: white;
            border-color: #2a7de1;
        }
        .category-chip.all-chip {
            background: #f0f4fa;
            font-weight: 700;
        }
        .category-chip.all-chip.active {
            background: #1e3a5f;
            border-color: #1e3a5f;
            color: white;
        }
        .empty-state {
            text-align: center;
            padding: 48px 16px;
            color: #5f7390;
        }
        .empty-state i {
            font-size: 2.4rem;
            color: #cbd8e8;
            margin-bottom: 10px;
        }
        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #5f7390;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            padding: 0 6px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e3a5f;
            color: white;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 0.9rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
        }
        .sort-icon {
            font-size: 0.65rem;
            margin-left: 4px;
            opacity: 0.4;
            transition: opacity 0.2s;
            cursor: pointer;
        }
        .sort-icon.active {
            opacity: 1;
            color: #2a7de1;
        }
        .sortable-th {
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }
        .sortable-th:hover {
            background: #eef2fa !important;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-dialog {
            background: white;
            border-radius: 18px;
            width: 520px;
            max-width: 92vw;
            max-height: 75vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.18);
            transform: translateY(20px);
            transition: transform 0.25s ease;
        }
        .modal-overlay.show .modal-dialog {
            transform: translateY(0);
        }
        .modal-header {
            padding: 18px 22px;
            border-bottom: 1px solid #eef2f8;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-header h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #1e3a5f;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-header h3 i {
            color: #2a7de1;
        }
        .modal-close {
            border: none;
            background: #f0f4fa;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.9rem;
            color: #5f7390;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            background: #dce3ec;
        }
        .modal-search {
            padding: 12px 22px;
            border-bottom: 1px solid #eef2f8;
        }
        .modal-search input {
            width: 100%;
            padding: 9px 14px;
            border-radius: 30px;
            border: 1.5px solid #dce3ec;
            font-size: 0.82rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .modal-search input:focus {
            border-color: #2a7de1;
            box-shadow: 0 0 0 3px rgba(42, 125, 225, 0.1);
        }
        .modal-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 22px 16px;
        }
        .modal-list::-webkit-scrollbar {
            width: 6px;
        }
        .modal-list::-webkit-scrollbar-track {
            background: #eef2f8;
            border-radius: 3px;
        }
        .modal-list::-webkit-scrollbar-thumb {
            background: #c0d0e0;
            border-radius: 3px;
        }
        .modal-vehicle-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 2px;
        }
        .modal-vehicle-item:hover {
            background: #f5f8fc;
        }
        .modal-vehicle-item.selected {
            background: #e8f0fa;
            border: 1.5px solid #2a7de1;
        }
        .modal-vehicle-item .check-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #c0d0e0;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 0.6rem;
            color: transparent;
        }
        .modal-vehicle-item.selected .check-icon {
            background: #2a7de1;
            border-color: #2a7de1;
            color: white;
        }
        .modal-vehicle-item .v-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: #1e3a5f;
            flex: 1;
        }
        .modal-vehicle-item .v-plant {
            font-size: 0.72rem;
            color: #8a9bb5;
        }
        .modal-footer {
            padding: 14px 22px;
            border-top: 1px solid #eef2f8;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .modal-btn {
            padding: 8px 22px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .modal-btn-clear {
            background: #f0f4fa;
            color: #4a5a6e;
        }
        .modal-btn-clear:hover {
            background: #dce3ec;
        }
        .modal-btn-confirm {
            background: #2a7de1;
            color: white;
        }
        .modal-btn-confirm:hover {
            background: #1a5fb0;
        }
        @media (max-width: 900px) {
            .charts-row {
                flex-direction: column;
            }
        }
        @media (max-width: 700px) {
            .header h1 {
                font-size: 1.2rem;
            }
            .header-right {
                width: 100%;
                justify-content: flex-start;
                gap: 8px;
            }
            .sticky-table .col-fixed {
                min-width: 80px;
                width: 80px;
            }
            .sticky-table .col-fixed:nth-child(1) {
                left: 0;
            }
            .sticky-table .col-fixed:nth-child(2) {
                left: 80px;
            }
            .sticky-table .col-month {
                min-width: 160px;
                width: 160px;
            }
            .sticky-table th,
            .sticky-table td {
                padding: 8px 8px;
                font-size: 0.7rem;
            }
            .category-item {
                font-size: 0.7rem;
                padding: 3px 6px;
            }
            .sticky-table thead tr:not(.filter-row) th {
                top: 44px;
            }
            .chart-canvas-wrap {
                height: 220px;
            }
            .rank-list {
                max-height: 220px;
            }
            .modal-dialog {
                width: 95vw;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">
    </script>
</head>
<body>
    <div class="dashboard" id="app">
        <div class="header">

            <div class="chart-panel" id="rankPanel">

                    <i class="fa-solid fa-trophy"></i> 排行榜 TOP 20

                    <button class="modal-btn modal-btn-clear" id="modalClearPlant">显示全部</button>

                    <button class="modal-close" id="modalCloseFuel"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="modal-search">
                    <input type="text" id="modalSearchFuel" placeholder="搜索燃油种类...">
                </div>
                <div class="modal-list" id="modalFuelList"></div>
                <div class="modal-footer">
                    <button class="modal-btn modal-btn-clear" id="modalClearFuel">显示全部</button>
                    <button class="modal-btn modal-btn-confirm" id="modalConfirmFuel">确认</button>
                </div>

    </div>
    <script>
        (function() {
            const API_URL = 'https://script.google.com/macros/s/AKfycbzs7Nu6alsk907dHU5AhsS_cD32hVAOhQUtMbnLO7ADr_QhZgM4ftxYAqPNpHr0x1avNw/exec';
            const CATEGORIES = ['Shell', 'Petronas', 'Cash', 'Delta Swasta', 'Petron', 'Stesen Minyak Hakurun', 'Tangki',
                'Total'
            ];
            const STAT_CATEGORIES = ['Shell', 'Petronas', 'Cash', 'Delta Swasta', 'Petron', 'Stesen Minyak Hakurun',
                'Tangki'
            ];
            const EXCLUDED_MONTH_PREFIXES = ['TOTAL', 'AVERAGE'];
            const CACHE_TTL = 3 * 24 * 60 * 60 * 1000;
            const CACHE_KEY = 'fuel_dashboard_data';
            const CACHE_TIME_KEY = 'fuel_dashboard_timestamp';
            let showRM = true,
                showLiter = true;
            let selectedYear = '全部',
                selectedMonth = '全部';
            let selectedVehicle = null;
            let selectedPlant = null;
            let selectedType = null;
            let selectedFuel = null;
            let selectedCategories = ['Total'];
            let cachedData = null,
                isRefreshing = false,
                yearOptionsBuilt = false;
            let rankType = 'rm';
            let trendChart = null;
            let sortState = { column: null, direction: 0 };
            let vehicleModalVisible = false,
                plantModalVisible = false,
                typeModalVisible = false,
                fuelModalVisible = false;
            let vehicleSearchTerm = '',
                plantSearchTerm = '',
                typeSearchTerm = '',
                fuelSearchTerm = '';
            let tempSelectedVehicle = null,
                tempSelectedPlant = null,
                tempSelectedType = null,
                tempSelectedFuel = null;
            const $ = id => document.getElementById(id);
            const statVehicles = $('statVehicles'),
                statPlants = $('statPlants'),
                statTypes = $('statTypes'),
                statFuels = $('statFuels');
            const statTotalRM = $('statTotalRM'),
                statTotalLiter = $('statTotalLiter');
            const statVehiclesSub = $('statVehiclesSub'),
                statPlantsSub = $('statPlantsSub'),
                statTypesSub = $('statTypesSub'),
                statFuelsSub = $('statFuelsSub');
            const statCardVehicles = $('statCardVehicles'),
                statCardPlants = $('statCardPlants'),
                statCardTypes = $('statCardTypes'),
                statCardFuels = $('statCardFuels');
            const tableHead = $('tableHead'),
                tableBody = $('tableBody');
            const cacheStatus = $('cacheStatus'),
                refreshBtn = $('refreshBtn');
            const toast = $('toast'),
                toastMsg = $('toastMsg');
            const toggleGroup = $('toggleGroup'),
                yearSelector = $('yearSelector');
            const rankToggleGroup = $('rankToggleGroup');
            const rankList = $('rankList');
            const vehicleModalOverlay = $('vehicleModalOverlay');
            const modalVehicleList = $('modalVehicleList');
            const modalSearchVehicle = $('modalSearchVehicle');
            const modalCloseVehicle = $('modalCloseVehicle');
            const modalClearVehicle = $('modalClearVehicle');
            const modalConfirmVehicle = $('modalConfirmVehicle');
            const plantModalOverlay = $('plantModalOverlay');
            const modalPlantList = $('modalPlantList');
            const modalSearchPlant = $('modalSearchPlant');
            const modalClosePlant = $('modalClosePlant');
            const modalClearPlant = $('modalClearPlant');
            const modalConfirmPlant = $('modalConfirmPlant');
            const typeModalOverlay = $('typeModalOverlay');
            const modalTypeList = $('modalTypeList');
            const modalSearchType = $('modalSearchType');
            const modalCloseType = $('modalCloseType');
            const modalClearType = $('modalClearType');
            const modalConfirmType = $('modalConfirmType');
            const fuelModalOverlay = $('fuelModalOverlay');
            const modalFuelList = $('modalFuelList');
            const modalSearchFuel = $('modalSearchFuel');
            const modalCloseFuel = $('modalCloseFuel');
            const modalClearFuel = $('modalClearFuel');
            const modalConfirmFuel = $('modalConfirmFuel');
            const exportBtn = $('exportBtn');

            function fmt(num) {
                const n = Number(num);
                return Number.isFinite(n) ? n.toFixed(2) : '0.00';
            }

            function fmtComma(num) {
                const parts = fmt(num).split('.');
                parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                return parts.join('.');
            }

            function getCache() {
                try {
                    const raw = localStorage.getItem(CACHE_KEY);
                    const time = localStorage.getItem(CACHE_TIME_KEY);
                    return raw && time ? { data: JSON.parse(raw), timestamp: +time } : null;
                } catch { return null; }
            }

            function setCache(data) {
                try { localStorage.setItem(CACHE_KEY, JSON.stringify(data));
                    localStorage.setItem(CACHE_TIME_KEY, String(Date.now())); } catch {}
            }

            function isCacheValid(cache) { return cache && Date.now() - cache.timestamp < CACHE_TTL; }

            function formatCacheTime(ts) { return new Date(ts).toLocaleString('zh-CN', { hour12: false }); }

            function showToast(msg, icon = 'fa-check-circle') {
                toastMsg.textContent = msg;
                toast.querySelector('i').className = `fa-solid ${icon}`;
                toast.classList.add('show');
                clearTimeout(toast._t);
                toast._t = setTimeout(() => toast.classList.remove('show'), 3000);
            }

            function updateCacheBadge(status, ts) { cacheStatus.textContent = ts ? `${status} · ${formatCacheTime(ts)}` :
                    status; }

            function setLoading(loading) {
                if (loading) { refreshBtn.disabled = true;
                    refreshBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 更新中...'; } else { refreshBtn
                        .disabled = false;
                    refreshBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> 更新数据'; }
            }

            function isExcludedMonth(name) { return EXCLUDED_MONTH_PREFIXES.some(p => name.startsWith(p)); }

            function extractYear(str) {
                if (!str) return '';
                if (str.includes('-')) { const last = str.split('-').pop(); return /^\d{2}$/.test(last) ? '20' + last :
                    last; }
                const m4 = str.match(/\d{4}/);
                if (m4) return m4[0];
                const m2 = str.match(/\d{2}/);
                if (m2) return '20' + m2[0];
                return str;
            }

            function extractMonthAbbr(str) { return str.includes('-') ? str.split('-')[0] : str; }

            function monthSortKey(abbr) {
                const order = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                const idx = order.indexOf(abbr);
                return idx >= 0 ? idx : 99;
            }

            function fetchFromAPI() {
                return fetch(API_URL).then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res
                .json(); });
            }

            function fetchData(force = false) {
                const cache = getCache();
                if (force) {
                    updateCacheBadge('更新中...');
                    return fetchFromAPI().then(d => { setCache(d);
                            updateCacheBadge('已缓存', Date.now());
                            showToast('数据已更新'); return d; })
                        .catch(err => {
                            if (cache) { updateCacheBadge('过期缓存', cache.timestamp);
                                showToast('网络异常，使用缓存数据', 'fa-triangle-exclamation'); return cache
                                .data; }
                            throw err;
                        });
                }
                if (cache && isCacheValid(cache)) { updateCacheBadge('缓存', cache.timestamp); return Promise.resolve(cache
                        .data); }
                updateCacheBadge('更新中...');
                return fetchFromAPI().then(d => { setCache(d);
                        updateCacheBadge('已缓存', Date.now()); return d; })
                    .catch(err => { if (cache) { updateCacheBadge('过期缓存', cache.timestamp);
                            showToast('网络异常，使用缓存数据', 'fa-triangle-exclamation'); return cache.data; } throw err; });
            }

            function getFixedColValue(vehicle, col) {
                const map = { vehicle: 'vehicle', plant: 'plant', brand: 'brand', type: 'type', fuel: 'fuel' };
                const key = map[col];
                return (vehicle[key] || '').toString().toLowerCase();
            }

            function getTypeCombo(vehicle) {
                const brand = vehicle.brand || '-';
                const type = vehicle.type || '-';
                return brand + ' - ' + type;
            }

            function getFuelList(vehicles) {
                return [...new Set(vehicles.map(v => v.fuel || '-'))].sort();
            }

            function getFilteredVehicles(allVehicles) {
                let result = [...allVehicles];
                if (selectedVehicle) {
                    result = result.filter(v => v.vehicle === selectedVehicle);
                } else if (selectedPlant) {
                    result = result.filter(v => v.plant === selectedPlant);
                } else if (selectedType) {
                    result = result.filter(v => getTypeCombo(v) === selectedType);
                } else if (selectedFuel) {
                    result = result.filter(v => (v.fuel || '-') === selectedFuel);
                }
                return result;
            }

            function sortVehicles(vehicles) {
                if (sortState.direction === 0 || !sortState.column) return [...vehicles];
                const col = sortState.column;
                const dir = sortState.direction;
                const sorted = [...vehicles];
                sorted.sort((a, b) => {
                    const valA = getFixedColValue(a, col);
                    const valB = getFixedColValue(b, col);
                    if (valA < valB) return -1 * dir;
                    if (valA > valB) return 1 * dir;
                    return 0;
                });
                return sorted;
            }

            function getSortIcon(colKey) {
                if (sortState.column !== colKey || sortState.direction === 0) {
                    return '<i class="fa-solid fa-sort sort-icon"></i>';
                }
                const icon = sortState.direction === 1 ? 'fa-sort-up' : 'fa-sort-down';
                return `<i class="fa-solid ${icon} sort-icon active"></i>`;
            }

            function handleSortClick(colKey) {
                if (sortState.column === colKey) {
                    if (sortState.direction === 1) sortState.direction = -1;
                    else if (sortState.direction === -1) { sortState.direction = 0;
                        sortState.column = null; } else sortState.direction = 1;
                } else {
                    sortState.column = colKey;
                    sortState.direction = 1;
                }
                cachedData && render(cachedData);
            }

            function getChartMonths(allRegularMonths) {
                const now = new Date();
                const thisYear = String(now.getFullYear());
                const thisMonthAbbr = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][
                    now.getMonth()
                ];
                if (selectedYear === '全部' || selectedYear === thisYear) {
                    const sorted = [...allRegularMonths].sort((a, b) => {
                        const ya = extractYear(a),
                            yb = extractYear(b);
                        if (ya !== yb) return ya.localeCompare(yb);
                        return monthSortKey(extractMonthAbbr(a)) - monthSortKey(extractMonthAbbr(b));
                    });
                    const thisMonthStr = thisMonthAbbr + '-' + thisYear.slice(2);
                    let endIdx = sorted.findIndex(m => m === thisMonthStr);
                    if (endIdx < 0) {
                        for (let i = sorted.length - 1; i >= 0; i--) {
                            const y = extractYear(sorted[i]);
                            const mAbbr = extractMonthAbbr(sorted[i]);
                            if (y < thisYear || (y === thisYear && monthSortKey(mAbbr) <= monthSortKey(thisMonthAbbr))) {
                                endIdx = i;
                                break;
                            }
                        }
                    }
                    if (endIdx < 0) endIdx = sorted.length - 1;
                    const startIdx = Math.max(0, endIdx - 11);
                    return sorted.slice(startIdx, endIdx + 1);
                } else {
                    const yearMonths = allRegularMonths.filter(m => extractYear(m) === selectedYear);
                    return yearMonths.sort((a, b) => monthSortKey(extractMonthAbbr(a)) - monthSortKey(extractMonthAbbr(b)));
                }
            }

            function getMonthCategorySum(vehicles, month, category) {
                let sum = 0;
                vehicles.forEach(v => {
                    const md = v.months[month];
                    if (md && md[category]) {
                        sum += showRM ? (md[category].rm || 0) : (md[category].liter || 0);
                    }
                });
                return parseFloat(sum.toFixed(2));
            }

            function updateTrendChart(allRegularMonths, vehicles) {
                const chartMonths = getChartMonths(allRegularMonths);
                const labels = chartMonths;
                const rmData = [];
                const literData = [];
                const calcCats = (selectedCategories.length === 1 && selectedCategories[0] === 'Total') ? selectedCategories : selectedCategories.filter(c => c !== 'Total');
                chartMonths.forEach(m => {
                    let rmSum = 0,
                        literSum = 0;
                    vehicles.forEach(v => {
                        const md = v.months[m];
                        if (!md) return;
                        calcCats.forEach(cat => {
                            const p = md[cat];
                            if (p) { rmSum += p.rm || 0;
                                literSum += p.liter || 0; }
                        });
                    });
                    rmData.push(parseFloat(rmSum.toFixed(2)));
                    literData.push(parseFloat(literSum.toFixed(2)));
                });
                const ctx = document.getElementById('trendChart');
                if (!ctx) return;
                if (trendChart) trendChart.destroy();
                trendChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'RM',
                            data: rmData,
                            borderColor: '#1f5f9e',
                            backgroundColor: 'rgba(31,95,158,0.08)',
                            borderWidth: 2.5,
                            tension: 0.35,
                            fill: true,
                            pointRadius: 4,
                            pointBackgroundColor: '#1f5f9e',
                            yAxisID: 'y'
                        }, {
                            label: 'Liter',
                            data: literData,
                            borderColor: '#1f8b6b',
                            backgroundColor: 'rgba(31,139,107,0.06)',
                            borderWidth: 2.5,
                            tension: 0.35,
                            fill: true,
                            pointRadius: 4,
                            pointBackgroundColor: '#1f8b6b',
                            yAxisID: 'y1'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: { position: 'bottom', labels: { usePointStyle: true, padding: 24,
                                    boxWidth: 10 } },
                            tooltip: { callbacks: { label: function(ctx) { return ctx.dataset.label +
                                        ': ' + ctx.parsed.y.toFixed(2); } } }
                        },
                        scales: {
                            y: {
                                type: 'linear',
                                position: 'left',
                                title: { display: true, text: 'RM', color: '#1f5f9e' },
                                ticks: { callback: v => v.toFixed(0), color: '#1f5f9e' },
                                grid: { color: '#eef3f9' }
                            },
                            y1: {
                                type: 'linear',
                                position: 'right',
                                title: { display: true, text: 'Liter', color: '#1f8b6b' },
                                ticks: { callback: v => v.toFixed(0), color: '#1f8b6b' },
                                grid: { drawOnChartArea: false }
                            },
                            x: { ticks: { maxRotation: 45, font: { size: 11 } },
                                grid: { display: false } }
                        }
                    }
                });
            }

            function updateRankList(vehicles, regularMonths) {
                let rankings = [];
                const calcCats = (selectedCategories.length === 1 && selectedCategories[0] === 'Total') ? selectedCategories : selectedCategories.filter(c => c !== 'Total');
                vehicles.forEach(v => {
                    let totalVal = 0;
                    if (selectedMonth !== '全部') {
                        let candidates = regularMonths.filter(m => extractMonthAbbr(m) === selectedMonth);
                        if (selectedYear !== '全部') {
                            candidates = candidates.filter(m => extractYear(m) === selectedYear);
                        }
                        const matchedMonth = candidates[0];
                        const md = matchedMonth ? v.months[matchedMonth] : null;
                        if (md) {
                            calcCats.forEach(cat => {
                                const p = md[cat];
                                if (p) totalVal += rankType === 'rm' ? (p.rm || 0) : (p.liter || 0);
                            });
                        }
                    } else if (selectedYear !== '全部') {
                        const yearMonths = regularMonths.filter(m => extractYear(m) === selectedYear);
                        yearMonths.forEach(m => {
                            const md = v.months[m];
                            if (md) {
                                calcCats.forEach(cat => {
                                    const p = md[cat];
                                    if (p) totalVal += rankType === 'rm' ? (p.rm || 0) : (p.liter ||
                                        0);
                                });
                            }
                        });
                    } else {
                        regularMonths.forEach(m => {
                            const md = v.months[m];
                            if (md) {
                                calcCats.forEach(cat => {
                                    const p = md[cat];
                                    if (p) totalVal += rankType === 'rm' ? (p.rm || 0) : (p.liter ||
                                        0);
                                });
                            }
                        });
                    }
                    rankings.push({ vehicle: v.vehicle || '-', plant: v.plant || '-', value: totalVal });
                });
                rankings.sort((a, b) => b.value - a.value);
                const top20 = rankings.slice(0, 20);
                if (top20.length === 0) {
                    rankList.innerHTML = '<li class="rank-empty"><i class="fa-solid fa-box-open"></i> 暂无数据</li>';
                    return;
                }
                let html = '';
                top20.forEach((r, i) => {
                    const displayVal = rankType === 'rm' ? ('RM ' + fmtComma(r.value)) : (fmtComma(r.value) +
                        ' L');
                    html += `
                <li class="rank-item">
                  <span class="rank-num">${i+1}</span>
                  <div class="rank-info">
                    <div class="rank-name">${r.vehicle}</div>
                    <div class="rank-detail">${r.plant}</div>
                  </div>

            function exportToExcel() {
                if (!cachedData || !cachedData.vehicles) {
                    showToast('暂无数据可导出', 'fa-triangle-exclamation');
                    return;
                }

                const allMonths = cachedData.months;
                const regular = allMonths.filter(m => !isExcludedMonth(m));
                const excluded = allMonths.filter(isExcludedMonth);

                let filtered = regular;
                if (selectedYear !== '全部') filtered = filtered.filter(m => extractYear(m) === selectedYear);
                if (selectedMonth !== '全部') filtered = filtered.filter(m => extractMonthAbbr(m) === selectedMonth);
                const displayMonths = selectedMonth === '全部'
                    ? [...filtered, ...(selectedYear !== '全部' ? excluded.filter(m => extractYear(m) === selectedYear) : excluded)]
                    : filtered;

                const filteredVehicles = getFilteredVehicles(cachedData.vehicles);

                if (!filteredVehicles.length || !displayMonths.length) {
                    showToast('当前筛选无数据可导出', 'fa-triangle-exclamation');
                    return;
                }

                const sortedVehicles = [...filteredVehicles].sort((a, b) => {
                    const plantA = (a.plant || '-').toString();
                    const plantB = (b.plant || '-').toString();
                    if (plantA !== plantB) return plantA.localeCompare(plantB);
                    const typeA = a.type || '-';
                    const typeB = b.type || '-';
                    return typeA.localeCompare(typeB);
                });

                function getVal(v, m, cat, isRM) {
                    const md = v.months[m];
                    if (!md) return 0;
                    const p = md[cat];
                    if (!p) return 0;
                    return isRM ? (p.rm || 0) : (p.liter || 0);
                }

                const valueTypes = [];
                if (showRM) valueTypes.push({ key: 'rm', label: 'RM' });
                if (showLiter) valueTypes.push({ key: 'liter', label: 'Liter' });
                if (valueTypes.length === 0) valueTypes.push({ key: 'rm', label: 'RM' });

                const exportData = [];
                const exportCats = selectedCategories;

                const headerRow1 = ['车牌', '分行', '车型', '燃油'];
                const monthColSpans = [];
                displayMonths.forEach(m => {
                    let span = 0;
                    exportCats.forEach(cat => { span += valueTypes.length; });
                    monthColSpans.push(span);
                    headerRow1.push(m);
                    for (let i = 1; i < span; i++) headerRow1.push('');
                });
                exportData.push(headerRow1);

                const headerRow2 = ['', '', '', ''];
                displayMonths.forEach(m => {
                    exportCats.forEach(cat => {
                        for (let i = 0; i < valueTypes.length; i++) {
                            headerRow2.push(i === 0 ? cat : '');
                        }
                    });
                });
                exportData.push(headerRow2);

                const headerRow3 = ['', '', '', ''];
                displayMonths.forEach(m => {
                    exportCats.forEach(cat => {
                        valueTypes.forEach(vt => { headerRow3.push(vt.label); });
                    });
                });
                exportData.push(headerRow3);

                let lastPlant = null;
                let lastType = null;
                let plantSubtotals = {};
                let typeSubtotals = {};
                let categoryTotals = {};

                sortedVehicles.forEach(v => {
                    const plant = v.plant || '-';
                    const type = v.type || '-';

                    if (lastPlant !== null && plant !== lastPlant) {
                        if (lastType !== null) {
                            exportData.push(generateSubtotalRow('车型小计', '', lastType, displayMonths, typeSubtotals[lastPlant + '|||' + lastType]));
                        }
                        exportData.push(generateSubtotalRow('分行小计', lastPlant, '', displayMonths, plantSubtotals[lastPlant]));
                    }
                    if (lastType !== null && type !== lastType && lastPlant === plant) {
                        exportData.push(generateSubtotalRow('车型小计', '', lastType, displayMonths, typeSubtotals[lastPlant + '|||' + lastType]));
                    }

                    const row = [v.vehicle || '-', plant, type, v.fuel || '-'];
                    displayMonths.forEach(m => {
                        exportCats.forEach(cat => {
                            valueTypes.forEach(vt => {
                                row.push(getVal(v, m, cat, vt.key === 'rm'));
                            });
                        });
                    });
                    exportData.push(row);

                    if (!plantSubtotals[plant]) {
                        plantSubtotals[plant] = {};
                        displayMonths.forEach(m => {
                            plantSubtotals[plant][m] = {};
                            exportCats.forEach(cat => { plantSubtotals[plant][m][cat] = { rm: 0, liter: 0 }; });
                        });
                    }
                    displayMonths.forEach(m => {
                        exportCats.forEach(cat => {
                            plantSubtotals[plant][m][cat].rm += getVal(v, m, cat, true);
                            plantSubtotals[plant][m][cat].liter += getVal(v, m, cat, false);
                        });
                    });

                    const typeKey = plant + '|||' + type;
                    if (!typeSubtotals[typeKey]) {
                        typeSubtotals[typeKey] = {};
                        displayMonths.forEach(m => {
                            typeSubtotals[typeKey][m] = {};
                            exportCats.forEach(cat => { typeSubtotals[typeKey][m][cat] = { rm: 0, liter: 0 }; });
                        });
                    }
                    displayMonths.forEach(m => {
                        exportCats.forEach(cat => {
                            typeSubtotals[typeKey][m][cat].rm += getVal(v, m, cat, true);
                            typeSubtotals[typeKey][m][cat].liter += getVal(v, m, cat, false);
                        });
                    });

                    exportCats.forEach(cat => {
                        if (!categoryTotals[cat]) categoryTotals[cat] = { rm: 0, liter: 0 };
                        displayMonths.forEach(m => {
                            categoryTotals[cat].rm += getVal(v, m, cat, true);
                            categoryTotals[cat].liter += getVal(v, m, cat, false);
                        });
                    });

                    lastPlant = plant;
                    lastType = type;
                });

                if (lastType !== null && lastPlant !== null) {
                    exportData.push(generateSubtotalRow('车型小计', '', lastType, displayMonths, typeSubtotals[lastPlant + '|||' + lastType]));
                }
                if (lastPlant !== null) {
                    exportData.push(generateSubtotalRow('分行小计', lastPlant, '', displayMonths, plantSubtotals[lastPlant]));
                }

                exportData.push([]);

                exportCats.forEach(cat => {
                    exportData.push(generateGrandRow(cat + ' 总计', '', displayMonths, cat, categoryTotals[cat]));
                });

                exportData.push([]);

                const allCatsTotal = { rm: 0, liter: 0 };
                exportCats.forEach(cat => {
                    if (categoryTotals[cat]) {
                        allCatsTotal.rm += categoryTotals[cat].rm;
                        allCatsTotal.liter += categoryTotals[cat].liter;
                    }
                });
                exportData.push(generateGrandRow('所有类别总计', '', displayMonths, null, allCatsTotal));

                function generateSubtotalRow(label, plant, type, months, subtotalData) {
                    const row = ['', plant || '', '', type || ''];
                    row[0] = label;
                    months.forEach(m => {
                        exportCats.forEach(cat => {
                            valueTypes.forEach(vt => {
                                const sd = subtotalData && subtotalData[m] && subtotalData[m][cat];
                                row.push(sd ? (vt.key === 'rm' ? sd.rm : sd.liter) : 0);
                            });
                        });
                    });
                    return row;
                }

                function generateGrandRow(label, plant, months, cat, totalData) {
                    const row = [label, plant || '', '', ''];
                    months.forEach(m => {
                        if (cat) {
                            valueTypes.forEach(vt => {
                                row.push(totalData ? (vt.key === 'rm' ? totalData.rm : totalData.liter) : 0);
                            });
                        } else {
                            exportCats.forEach(c => {
                                valueTypes.forEach(vt => {
                                    row.push(totalData ? (vt.key === 'rm' ? totalData.rm : totalData.liter) : 0);
                                });
                            });
                        }
                    });
                    return row;
                }

                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet(exportData);

                const fixedCols = 4;
                const totalCols = fixedCols + displayMonths.reduce((sum, m) => sum + exportCats.length * valueTypes.length, 0);
                const totalRows = exportData.length;

                const colWidths = [
                    { wch: 18 }, { wch: 20 }, { wch: 18 }, { wch: 14 }
                ];
                displayMonths.forEach(m => {
                    exportCats.forEach(cat => {
                        valueTypes.forEach(vt => { colWidths.push({ wch: 14 }); });
                    });
                });
                ws['!cols'] = colWidths;

                const merges = [];
                let colOffset = fixedCols;
                displayMonths.forEach((m, idx) => {
                    const span = monthColSpans[idx];
                    if (span > 1) {
                        merges.push({ s: { r: 0, c: colOffset }, e: { r: 0, c: colOffset + span - 1 } });
                    }
                    let catCol = colOffset;
                    exportCats.forEach(cat => {
                        if (valueTypes.length > 1) {
                            merges.push({ s: { r: 1, c: catCol }, e: { r: 1, c: catCol + valueTypes.length - 1 } });
                        }
                        catCol += valueTypes.length;
                    });
                    colOffset += span;
                });
                ws['!merges'] = merges;

                ws['!freeze'] = { xSplit: fixedCols, ySplit: 3, topLeftCell: XLSX.utils.encode_cell({ r: 3, c: fixedCols }), activePane: 'bottomRight', state: 'frozen' };

                for (let r = 3; r < totalRows; r++) {
                    for (let c = fixedCols; c < totalCols; c++) {
                        const cellRef = XLSX.utils.encode_cell({ r: r, c: c });
                        if (ws[cellRef] && typeof ws[cellRef].v === 'number') {
                            ws[cellRef].z = '#,##0.00';
                        }
                    }
                }

                XLSX.utils.book_append_sheet(wb, ws, '燃油数据');

                const now = new Date();
                const timestamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
                const filterInfo = [];
                if (selectedYear !== '全部') filterInfo.push(selectedYear);
                if (selectedMonth !== '全部') filterInfo.push(selectedMonth);
                if (selectedVehicle) filterInfo.push(selectedVehicle);
                else if (selectedPlant) filterInfo.push(selectedPlant);
                else if (selectedType) filterInfo.push(selectedType);
                else if (selectedFuel) filterInfo.push(selectedFuel);
                const filterStr = filterInfo.length > 0 ? '_' + filterInfo.join('_') : '';
                const filename = `Fuel_Report${filterStr}_${timestamp}.xlsx`;

                XLSX.writeFile(wb, filename);
                showToast(`已导出: ${filename}`, 'fa-file-excel');
            }

            function render(data) {

                    tableBody.innerHTML =
                        `<tr><td colspan="10" class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i> 数据格式错误</td></tr>`;
                    return false;
                }
                const allMonths = data.months;
                const regular = allMonths.filter(m => !isExcludedMonth(m));
                const excluded = allMonths.filter(isExcludedMonth);
                const years = [...new Set(regular.map(extractYear))].sort();
                const monthAbbrs = [...new Set(regular.map(extractMonthAbbr))].sort((a, b) => monthSortKey(a) - monthSortKey(
                    b));
                if (!yearOptionsBuilt) {
                    yearSelector.innerHTML = '<option value="全部">全部年份</option>';
                    years.forEach(y => yearSelector.innerHTML += `<option value="${y}">${y}</option>`);
                    const cy = String(new Date().getFullYear());
                    yearSelector.value = years.includes(cy) ? cy : (years[0] || '全部');
                    selectedYear = yearSelector.value;
                    yearOptionsBuilt = true;
                }
                let filtered = regular;
                if (selectedYear !== '全部') filtered = filtered.filter(m => extractYear(m) === selectedYear);
                if (selectedMonth !== '全部') filtered = filtered.filter(m => extractMonthAbbr(m) === selectedMonth);
                const display = selectedMonth === '全部' ? [...filtered, ...(selectedYear !== '全部' ? excluded.filter(m =>
                    extractYear(m) === selectedYear) : excluded)] : filtered;
                const allVehicles = data.vehicles;
                const filteredVehicles = getFilteredVehicles(allVehicles);
                const sortedVehicles = sortVehicles(filteredVehicles);
                const totalVehicleCount = allVehicles.length;
                const allPlants = [...new Set(allVehicles.map(v => v.plant || '-'))];
                const totalPlantCount = allPlants.length;
                const allTypeCombos = [...new Set(allVehicles.map(v => getTypeCombo(v)))];
                const totalTypeCount = allTypeCombos.length;
                const allFuels = getFuelList(allVehicles);
                const totalFuelCount = allFuels.length;
                const currentVehicleCount = (selectedPlant || selectedType || selectedFuel) ? sortedVehicles.length : (
                    selectedVehicle ? 1 : totalVehicleCount);
                statVehicles.textContent = currentVehicleCount;
                statVehiclesSub.textContent = selectedVehicle ? `已选: ${selectedVehicle}` : (selectedPlant ?
                    `${selectedPlant} 分行` : (selectedType ? `${selectedType}` : (selectedFuel ?
                        `${selectedFuel}` : '点击选择车牌')));
                statPlants.textContent = selectedPlant ? '1' : totalPlantCount;
                statPlantsSub.textContent = selectedPlant ? `已选: ${selectedPlant}` : (selectedVehicle ?
                    `车牌: ${selectedVehicle}` : (selectedType ? `${selectedType}` : (selectedFuel ?
                        `${selectedFuel}` : '点击选择分行')));
                statTypes.textContent = selectedType ? '1' : totalTypeCount;
                statTypesSub.textContent = selectedType ? `已选: ${selectedType}` : (selectedVehicle ?
                    `车牌: ${selectedVehicle}` : (selectedPlant ? `${selectedPlant} 分行` : (selectedFuel ?
                        `${selectedFuel}` : '点击选择车型')));
                statFuels.textContent = selectedFuel ? '1' : totalFuelCount;
                statFuelsSub.textContent = selectedFuel ? `已选: ${selectedFuel}` : (selectedVehicle ?
                    `车牌: ${selectedVehicle}` : (selectedPlant ? `${selectedPlant} 分行` : (selectedType ?
                        `${selectedType}` : '点击选择燃油种类')));
                let totalRM = 0,
                    totalLiter = 0;
                const calcCats = (selectedCategories.length === 1 && selectedCategories[0] === 'Total') ? selectedCategories : selectedCategories.filter(c => c !== 'Total');
                sortedVehicles.forEach(v => {
                    filtered.forEach(m => {
                        const md = v.months[m];
                        if (!md) return;
                        calcCats.forEach(cat => {
                            const p = md[cat];
                            if (p) { totalRM += p.rm || 0;
                                totalLiter += p.liter || 0; }
                        });
                    });
                });
                statTotalRM.textContent = fmtComma(totalRM);
                statTotalLiter.textContent = fmtComma(totalLiter);
                updateTrendChart(regular, sortedVehicles);
                updateRankList(sortedVehicles, regular);
                updateRankToggleUI();
                if (vehicleModalVisible && cachedData) renderVehicleModalList();
                if (plantModalVisible && cachedData) renderPlantModalList();
                if (typeModalVisible && cachedData) renderTypeModalList();
                if (fuelModalVisible && cachedData) renderFuelModalList();
                let head =
                    `<tr class="filter-row"><td class="col-fixed" colspan="2"><span class="filter-label"><i class="fa-solid fa-calendar-alt"></i> 月份筛选</span><select class="month-selector" id="monthSelector"><option value="全部">全部月份</option>`;
                monthAbbrs.forEach(m => head += `<option value="${m}">${m}</option>`);
                head += `</select><span class="category-filter-wrap"><span class="filter-label"><i class="fa-solid fa-gas-pump"></i> 类别</span><span class="category-chips" id="categoryChipsWrap"></span></span></td>`;
                head +=
                    `<td colspan="${display.length+3}" style="background:#f8faff;"><span style="font-size:.75rem;color:#5e7390;"><i class="fa-solid fa-filter"></i> 共 ${filtered.length} 个月份${selectedMonth==='全部'&&display.length>filtered.length?` + ${display.length-filtered.length} 个汇总`:''}</span></td></tr>`;
                head += `<tr>`;
                const fixedCols = ['vehicle', 'plant', 'brand', 'type', 'fuel'];
                const fixedLabels = ['车牌', '分行', '品牌', '车型', '燃油'];
                const fixedIcons = ['car', 'store', 'tag', 'shapes', 'gas-pump'];
                fixedCols.forEach((col, i) => {
                    const isFrozen = (col === 'vehicle' || col === 'plant');
                    const cls = isFrozen ? ' col-fixed sortable-th' : '';
                    head +=
                        `<th class="${cls}" data-sort="${col}"><i class="fa-solid fa-${fixedIcons[i]}"></i> ${fixedLabels[i]} ${getSortIcon(col)}</th>`;
                });
                display.forEach(m => {
                    const isSum = isExcludedMonth(m);
                    head +=
                        `<th class="col-month"><span style="background:${isSum?'#f0e6d0':'#eef4fd'};padding:2px 10px;border-radius:40px;font-size:.75rem;color:${isSum?'#8a6e3b':'#1f3a5e'};font-weight:${isSum?'700':'500'}">${m}</span></th>`;
                });
                head += `</tr>`;
                tableHead.innerHTML = head;
                renderCategoryChips();
                const monthSelector = document.getElementById('monthSelector');
                if (monthSelector) monthSelector.value = monthAbbrs.includes(selectedMonth) ? selectedMonth : '全部';
                let body = '';
                if (!sortedVehicles.length || !display.length) {
                    tableBody.innerHTML =
                        `<tr><td colspan="${display.length+5}" class="empty-state"><i class="fa-solid fa-box-open"></i> 暂无数据</td></tr>`;
                    return true;
                }
                sortedVehicles.forEach(v => {
                    body += `<tr>`;
                    body +=
                        `<td class="col-fixed"><div class="vehicle-cell">${v.vehicle||'-'}</div></td>`;
                    body +=
                        `<td class="col-fixed">${v.plant||'-'}</td>`;
                    body +=
                        `<td>${v.brand||'-'}</td>`;
                    body +=
                        `<td>${v.type||'-'}</td>`;
                    body +=
                        `<td>${v.fuel||'-'}</td>`;
                    display.forEach(m => {
                        const md = v.months[m];
                        body += `<td class="col-month">`;
                        if (!md) { body +=
                                `<div class="category-item"><span class="cat-name">—</span></div>`; } else {
                            CATEGORIES.forEach(cat => {
                                if (!selectedCategories.includes(cat)) return;
                                const p = md[cat];
                                const rm = p ? fmtComma(p.rm) : '0.00';
                                const lit = p ? fmtComma(p.liter) : '0.00';
                                const hasVal = p && (p.rm || p.liter);
                                if (!hasVal) {
                                    body +=
                                        `<div class="category-item"><span class="cat-name">${cat}</span><div class="val-row"><span style="color:#aaa;">—</span></div></div>`;
                                    return;
                                }
                                let valHtml = '';
                                if (showRM) valHtml +=
                                    `<span class="rm-value">${rm}</span>`;
                                if (showLiter) valHtml +=
                                    `<span class="liter-value">${lit}</span>`;
                                if (!showRM && !showLiter) valHtml =
                                    `<span style="color:#b0c7df;">—</span>`;
                                body +=
                                    `<div class="category-item"><span class="cat-name">${cat}</span><div class="val-row">${valHtml}</div></div>`;
                            });
                        }
                        body += `</td>`;
                    });
                    body += `</tr>`;
                });
                tableBody.innerHTML = body;
                tableHead.querySelectorAll('.sortable-th').forEach(th => {
                    th.addEventListener('click', function(e) {
                        const sortKey = this.dataset.sort;
                        if (sortKey) handleSortClick(sortKey);
                    });
                });
                return true;
            }

            function loadData(force = false) {
                if (isRefreshing) return;
                isRefreshing = true;
                if (force) setLoading(true);
                fetchData(force).then(d => { cachedData = d;
                        render(d); })
                    .catch(err => {
                        tableBody.innerHTML =
                            `<tr><td colspan="10" class="empty-state" style="color:#b33;"><i class="fa-solid fa-triangle-exclamation"></i> 加载失败: ${err.message}</td></tr>`;
                        showToast('加载失败: ' + err.message, 'fa-triangle-exclamation');
                    }).finally(() => { isRefreshing = false;
                        setLoading(false); });
            }

            function updateToggle() {
                toggleGroup.querySelectorAll('.toggle-btn').forEach(b => {
                    b.className =
                        `toggle-btn ${b.dataset.type==='rm'?(showRM?'active-rm':''):(showLiter?'active-liter':'')}`;
                });
            }

            function init() {
                const cache = getCache();
                updateCacheBadge(cache ? '缓存' : '无缓存', cache?.timestamp);
                loadData();
                refreshBtn.addEventListener('click', () => !isRefreshing && loadData(true));
                exportBtn.addEventListener('click', exportToExcel);
                toggleGroup.addEventListener('click', e => {
                    const btn = e.target.closest('.toggle-btn');
                    if (!btn) return;
                    if (btn.dataset.type === 'rm') showRM = showRM ? (showLiter ? false : true) : true;
                    else showLiter = showLiter ? (showRM ? false : true) : true;
                    updateToggle();
                    cachedData && render(cachedData);
                });
                yearSelector.addEventListener('change', e => { selectedYear = e.target.value;
                    cachedData && render(cachedData); });
                tableHead.addEventListener('change', e => { if (e.target.id === 'monthSelector') { selectedMonth = e
                        .target.value;
                        cachedData && render(cachedData); } });
                rankToggleGroup.addEventListener('click', e => {
                    const btn = e.target.closest('.rank-toggle-btn');
                    if (!btn) return;
                    if (btn.dataset.rtype === 'rm') rankType = 'rm';
                    else rankType = 'liter';
                    cachedData && render(cachedData);
                });
                statCardVehicles.addEventListener('click', () => { if (!cachedData) return;
                    openVehicleModal(); });
                statCardPlants.addEventListener('click', () => { if (!cachedData) return;
                    openPlantModal(); });
                statCardTypes.addEventListener('click', () => { if (!cachedData) return;
                    openTypeModal(); });
                statCardFuels.addEventListener('click', () => { if (!cachedData) return;
                    openFuelModal(); });
                modalCloseVehicle.addEventListener('click', closeVehicleModal);
                vehicleModalOverlay.addEventListener('click', function(e) { if (e.target === vehicleModalOverlay)
                        closeVehicleModal(); });
                modalSearchVehicle.addEventListener('input', function() { vehicleSearchTerm = this.value;
                    renderVehicleModalList(); });
                modalClearVehicle.addEventListener('click', clearVehicleFilter);
                modalConfirmVehicle.addEventListener('click', applyVehicleFilter);
                modalClosePlant.addEventListener('click', closePlantModal);
                plantModalOverlay.addEventListener('click', function(e) { if (e.target === plantModalOverlay)
                        closePlantModal(); });
                modalSearchPlant.addEventListener('input', function() { plantSearchTerm = this.value;
                    renderPlantModalList(); });
                modalClearPlant.addEventListener('click', clearPlantFilter);
                modalConfirmPlant.addEventListener('click', applyPlantFilter);
                modalCloseType.addEventListener('click', closeTypeModal);
                typeModalOverlay.addEventListener('click', function(e) { if (e.target === typeModalOverlay)
                        closeTypeModal(); });
                modalSearchType.addEventListener('input', function() { typeSearchTerm = this.value;
                    renderTypeModalList(); });
                modalClearType.addEventListener('click', clearTypeFilter);
                modalConfirmType.addEventListener('click', applyTypeFilter);
                modalCloseFuel.addEventListener('click', closeFuelModal);
                fuelModalOverlay.addEventListener('click', function(e) { if (e.target === fuelModalOverlay)
                        closeFuelModal(); });
                modalSearchFuel.addEventListener('input', function() { fuelSearchTerm = this.value;
                    renderFuelModalList(); });
                modalClearFuel.addEventListener('click', clearFuelFilter);
                modalConfirmFuel.addEventListener('click', applyFuelFilter);
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        if (vehicleModalVisible) closeVehicleModal();
                        if (plantModalVisible) closePlantModal();
                        if (typeModalVisible) closeTypeModal();
                        if (fuelModalVisible) closeFuelModal();
                    }
                });
            }
            init();
        })();
    </script>
</body>
</html>
